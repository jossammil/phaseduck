<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Phase Deck · Live Google traffic</title>
    <link rel="icon" href="./mark.svg">
    <link rel="stylesheet" href="./deck.css">
  </head>
  <body class="traffic-page">
    <header class="top">
      <div class="brand"><img src="./mark.svg" alt="" width="30" height="30"><strong>Phase Deck</strong></div>
      <div class="top-actions">
        <a href="./">Studio</a>
        <button id="traffic-fullscreen" type="button" hidden>Full screen</button>
      </div>
    </header>
    <main class="traffic-view">
      <section class="traffic-intro">
        <h1>Live Google traffic</h1>
        <p>Jackson, Mississippi</p>
        <form id="traffic-key">
          <label for="maps-key">Your Google Maps JavaScript API key</label>
          <div class="panel-actions">
            <input id="maps-key" type="password" required autocomplete="off" spellcheck="false" maxlength="128" pattern="[A-Za-z0-9_\-]{20,128}" aria-describedby="traffic-setup">
            <button type="submit">Load traffic map</button>
          </div>
          <p id="traffic-setup" class="hint">Use a billing-enabled key restricted to Maps JavaScript API and this site’s origin. Phase Deck uses it for this page session.</p>
          <a href="https://developers.google.com/maps/documentation/javascript/get-api-key" target="_blank" rel="noopener noreferrer">Set up a browser key</a>
        </form>
        <p id="traffic-status" role="status"></p>
        <button id="traffic-retry" type="button" hidden>Reload traffic view</button>
      </section>
      <div id="live-traffic-map" role="region" aria-label="Google traffic map of Jackson, Mississippi" hidden></div>
    </main>
    <script type="module" src="./traffic.js"></script>
  </body>
</html>
